# package: dbus-system-bus-common
g messagebus 995
u messagebus 995 "System Message Bus" /nonexistent /usr/sbin/nologin
# package: openssh-server
u sshd 988:65534 "sshd user" /run/sshd /usr/sbin/nologin
# package: systemd
g lpadmin 999
g systemd-journal 998
g systemd-network 997
u! systemd-network 997 "systemd Network Management" / /usr/sbin/nologin
# package: systemd-resolved
g systemd-resolve 989
u! systemd-resolve 989 "systemd Resolver" / /usr/sbin/nologin
# package: systemd-timesyncd
g systemd-timesync 996
u! systemd-timesync 996 "systemd Time Synchronization" / /usr/sbin/nologin
# package: udev
g input 994
g sgx 993
g clock 992
g kvm 991
g render 990
# package: -
g ubuntu 1000
u ubuntu 1000 Ubuntu /home/ubuntu /bin/bash
m ubuntu adm
m ubuntu dialout
m ubuntu cdrom
m ubuntu floppy
m ubuntu sudo
m ubuntu audio
m ubuntu dip
m ubuntu video
m ubuntu plugdev
