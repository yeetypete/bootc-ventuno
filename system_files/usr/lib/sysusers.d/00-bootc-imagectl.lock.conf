# package: dbus-system-bus-common
g messagebus 101
u messagebus 100:101 - /nonexistent /usr/sbin/nologin
# package: systemd
g systemd-journal 999
g systemd-network 998
u systemd-network 998 "systemd Network Management" / /usr/sbin/nologin
# package: systemd-resolved
g systemd-resolve 992
u systemd-resolve 992 "systemd Resolver" / /usr/sbin/nologin
# package: systemd-timesyncd
g systemd-timesync 997
u systemd-timesync 997 "systemd Time Synchronization" / /usr/sbin/nologin
# package: udev
g input 996
g sgx 995
g kvm 994
g render 993
# package: openssh-client
g _ssh 103
# package: openssh-server
u sshd 102:65534 - /run/sshd /usr/sbin/nologin
# package: qcom-fastrpc1
g fastrpc 102
u fastrpc 101:102 - /nonexistent /usr/sbin/nologin
# package: -
g ubuntu 1000
u ubuntu 1000 Ubuntu /home/ubuntu /bin/bash
m ubuntu adm
m ubuntu dialout
m ubuntu cdrom
m ubuntu floppy
m ubuntu sudo
m ubuntu audio
m ubuntu dip
m ubuntu video
m ubuntu plugdev
