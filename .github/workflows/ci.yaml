name: ci

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ (github.ref == 'refs/heads/main') && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Run pre-commit hooks
        uses: j178/prek-action@bdca6f102f98e2b4c7029491a53dfd366469e33d # v2

  image:
    name: Build and push image
    needs: pre-commit
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install just and Podman
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y just podman

      # Every run pushes an image.
      - name: Login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          podman login docker.io \
            --username "$DOCKERHUB_USERNAME" --password-stdin <<< "$DOCKERHUB_TOKEN"

      - name: Login to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          podman login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin <<< "$GITHUB_TOKEN"

      # github.sha is a merge commit on PRs, so use the PR head sha instead.
      - name: Derive image tags
        id: tags
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "short_sha=${SHA::7}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image
        env:
          VERSION: ${{ steps.tags.outputs.version || steps.tags.outputs.short_sha }}
          REVISION: ${{ steps.tags.outputs.short_sha }}
          CACHE: ghcr.io/${{ github.repository }}/cache
        run: |
          just build \
            --build-arg VERSION="$VERSION" \
            --build-arg REVISION="$REVISION"

      - name: Push image
        env:
          SHORT_SHA: ${{ steps.tags.outputs.short_sha }}
          VERSION: ${{ steps.tags.outputs.version }}
        run: just push "$SHORT_SHA" "$VERSION"

  release:
    name: release
    if: github.ref_type == 'tag'
    needs: image
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
